services:
  - type: web
    name: nightcamfinds
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: CONTACT_EMAIL
        value: bunnybelle188@gmail.com
      - key: STATS_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # The application reads the database connection from DATABASE_URL.
      # Keep the credential in Render, never in GitHub.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
