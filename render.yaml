services:
  - type: web
    name: nightcamfinds
    runtime: node
    buildCommand: npm ci && node scripts/patch-seo-attribution-v2.js && node scripts/fix-server-syntax.js && node scripts/patch-spa-seo-routes.js && node scripts/fix-bonga-affiliate.js
    startCommand: npm start
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: CONTACT_EMAIL
        value: bunnybelle188@gmail.com
      - key: STATS_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nightcamfinds-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CB_CAMPAIGN
        sync: false
      - key: CB_TOUR
        sync: false
      - key: CB_POSTBACK_SECRET
        sync: false
      - key: BONGACAMS_CAMPAIGN
        sync: false
      - key: BONGACASH_POSTBACK_SECRET
        sync: false
