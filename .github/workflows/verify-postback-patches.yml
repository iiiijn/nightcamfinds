name: Verify affiliate postback and SEO patches

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-start-postback.js"
      - "scripts/patch-route.js"
      - "scripts/patch-tier-analytics.js"
      - "scripts/patch-seo-attribution.js"
      - "scripts/patch-dashboard-seo-attribution.js"
      - "start.js"
      - "route.js"
      - "public/dashboard.html"
      - ".github/workflows/verify-postback-patches.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-start-postback.js"
      - "scripts/patch-route.js"
      - "scripts/patch-tier-analytics.js"
      - "scripts/patch-seo-attribution.js"
      - "scripts/patch-dashboard-seo-attribution.js"
      - "start.js"
      - "route.js"
      - "public/dashboard.html"
      - ".github/workflows/verify-postback-patches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-patch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source syntax
        run: |
          node --check scripts/patch-start-postback.js
          node --check scripts/patch-route.js
          node --check scripts/patch-tier-analytics.js
          node --check scripts/patch-seo-attribution.js
          node --check scripts/patch-dashboard-seo-attribution.js
          node --check start.js
          node --check route.js
          node --check server.js

      - name: Apply startup patches in the CI workspace
        run: |
          node scripts/patch-start-postback.js
          node scripts/patch-route.js
          node scripts/patch-tier-analytics.js
          node scripts/patch-seo-attribution.js
          node scripts/patch-dashboard-seo-attribution.js

      - name: Check patched runtime syntax
        run: |
          node --check start.js
          node --check route.js

      - name: Confirm attribution handlers were applied
        run: |
          grep -q "allowedTypes.has(normalizedType)" start.js
          grep -q "NIGHTCAMFINDS_CB_POSTBACK_PATCH_V5" route.js
          grep -q "landing_path" start.js
          grep -q "seoRevenue" start.js
          grep -q "NIGHTCAMFINDS_DASHBOARD_SEO_ATTRIBUTION_V1" public/dashboard.html
          grep -n "landing_path" start.js
          grep -n "seoRevenue" start.js
