name: Verify affiliate postback and SEO patches

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-start-postback.js"
      - "scripts/patch-route.js"
      - "scripts/patch-tier-analytics.js"
      - "scripts/patch-seo-attribution.js"
      - "scripts/patch-dashboard-seo-attribution.js"
      - "start.js"
      - "route.js"
      - "public/dashboard.html"
      - ".github/workflows/verify-postback-patches.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-start-postback.js"
      - "scripts/patch-route.js"
      - "scripts/patch-tier-analytics.js"
      - "scripts/patch-seo-attribution.js"
      - "scripts/patch-dashboard-seo-attribution.js"
      - "start.js"
      - "route.js"
      - "public/dashboard.html"
      - ".github/workflows/verify-postback-patches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-patch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source syntax
        run: |
          node --check start.js
          node --check route.js
          node --check scripts/patch-spa-seo-routes.js

      - name: Apply startup patches in the CI workspace
        run: |
          node scripts/patch-spa-seo-routes.js

      - name: Check patched runtime syntax
        run: |
          node --check start.js
          node --check route.js

      - name: Confirm active postback runtime was applied
        run: |
          grep -q "NIGHTCAMFINDS_BONGA_REVSHARE_V1" route.js
          grep -q 'target.searchParams.set("c", BONGA_CAMPAIGN)' route.js

      - name: Install all production and test dependencies
        run: npm install

      - name: Run application tests
        run: npm test
