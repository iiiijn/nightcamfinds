name: Verify affiliate postback and SEO patches

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-spa-seo-routes.js"
      - "scripts/patch-seo-attribution-v2.js"
      - "scripts/fix-server-syntax.js"
      - "route.js"
      - "public/app.js"
      - "public/dashboard.html"
      - "package.json"
      - ".github/workflows/verify-postback-patches.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/patch-spa-seo-routes.js"
      - "scripts/patch-seo-attribution-v2.js"
      - "scripts/fix-server-syntax.js"
      - "route.js"
      - "public/app.js"
      - "public/dashboard.html"
      - "package.json"
      - ".github/workflows/verify-postback-patches.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-patch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check active source syntax
        run: |
          node --check route.js
          node --check scripts/patch-spa-seo-routes.js
          node --check scripts/patch-seo-attribution-v2.js
          node --check scripts/fix-server-syntax.js

      - name: Apply production startup patches in CI workspace
        run: |
          node scripts/patch-seo-attribution-v2.js
          node scripts/fix-server-syntax.js
          node scripts/patch-spa-seo-routes.js

      - name: Check patched runtime syntax
        run: |
          node --check route.js
          node --check public/app.js

      - name: Confirm active affiliate and SEO runtime markers
        run: |
          grep -q "NIGHTCAMFINDS_BONGA_REVSHARE_V1" route.js
          grep -q 'target.searchParams.set("c", BONGA_CAMPAIGN)' route.js
          grep -q "NIGHTCAMFINDS_SPA_SEO_ROUTES_V13" route.js
          grep -q "NIGHTCAMFINDS_SEO_ATTRIBUTION_ROUTE_V2" route.js
          grep -q "NIGHTCAMFINDS_SEO_ATTRIBUTION_CLIENT_V2" public/app.js
          grep -q "NIGHTCAMFINDS_DASHBOARD_SEO_ATTRIBUTION_V2" public/dashboard.html

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test
