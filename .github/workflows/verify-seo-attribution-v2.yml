name: Verify SEO attribution v2

on:
  push:
    paths:
      - "scripts/patch-seo-attribution-v2.js"
      - "scripts/patch-seo-attribution-v3.js"
      - "scripts/fix-server-syntax.js"
      - "scripts/patch-spa-seo-routes.js"
      - "scripts/fix-bonga-affiliate.js"
      - "scripts/verify-start-command.js"
      - "route.js"
      - "public/app.js"
      - "public/dashboard.html"
      - "package.json"
      - "render.yaml"
      - ".github/workflows/verify-seo-attribution-v2.yml"
  pull_request:
    paths:
      - "scripts/patch-seo-attribution-v2.js"
      - "scripts/patch-seo-attribution-v3.js"
      - "scripts/fix-server-syntax.js"
      - "scripts/patch-spa-seo-routes.js"
      - "scripts/fix-bonga-affiliate.js"
      - "scripts/verify-start-command.js"
      - "route.js"
      - "public/app.js"
      - "public/dashboard.html"
      - "package.json"
      - "render.yaml"
      - ".github/workflows/verify-seo-attribution-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check patch scripts
        run: |
          node --check scripts/patch-seo-attribution-v2.js
          node --check scripts/patch-seo-attribution-v3.js
          node --check scripts/fix-server-syntax.js
          node --check scripts/patch-spa-seo-routes.js
          node --check scripts/fix-bonga-affiliate.js
          node --check scripts/verify-start-command.js

      - name: Apply production build patches in CI workspace
        run: |
          node scripts/patch-seo-attribution-v2.js
          node scripts/fix-server-syntax.js
          node scripts/patch-spa-seo-routes.js
          node scripts/fix-bonga-affiliate.js

      - name: Check production JavaScript
        run: |
          node --check route.js
          node --check public/app.js
          node --check server.js

      - name: Check production startup command
        run: node scripts/verify-start-command.js

      - name: Check attribution and SEO markers
        run: |
          grep -q "NIGHTCAMFINDS_SEO_ATTRIBUTION_ROUTE_V2" route.js
          grep -q "NIGHTCAMFINDS_SEO_ATTRIBUTION_CLIENT_V2" public/app.js
          grep -q "NIGHTCAMFINDS_DASHBOARD_SEO_ATTRIBUTION_V2" public/dashboard.html
          grep -q "NIGHTCAMFINDS_SPA_SEO_ROUTES_V13" route.js

      - name: Install isolated test dependencies and run tests
        run: |
          cp package.json /tmp/nightcamfinds-package.json
          cp package-lock.json /tmp/nightcamfinds-package-lock.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies={}; p.devDependencies={"@electric-sql/pglite":"0.5.8"}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          rm package-lock.json
          npm cache clean --force
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            --registry=https://registry.npmjs.org/ \
            --fetch-retries=5 \
            --fetch-retry-mintimeout=2000 \
            --fetch-retry-maxtimeout=30000
          mv /tmp/nightcamfinds-package.json package.json
          mv /tmp/nightcamfinds-package-lock.json package-lock.json
          npm test
