name: NightCamFinds checks

on:
  push:
    branches: [main, revshare-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check route.js
          node --check start.js
          node --check scripts/patch-route.js
          node --check scripts/patch-start-postback.js
          node --check public/app.js
          node --check public/promo.js
          node --check src/services/chaturbate-revshare.cjs
      - name: Check inline JavaScript in served HTML
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          for (const file of ['public/index.html', 'public/promotools.html', 'public/dashboard.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const re = /<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi;
            let match, count = 0;
            while ((match = re.exec(html))) {
              const attrs = match[1] || '';
              const code = (match[2] || '').trim();
              if (!code || /\\bsrc\\s*=/.test(attrs) || /type=["']application\\/ld\\+json["']/.test(attrs)) continue;
              const filePath = path.join(os.tmpdir(), `ncf-inline-${path.basename(file)}-${count++}.js`);
              fs.writeFileSync(filePath, code);
              const check = spawnSync(process.execPath, ['--check', filePath], { encoding: 'utf8' });
              if (check.status !== 0) {
                process.stderr.write(`Syntax error in inline script from ${file}\\n${check.stderr}`);
                process.exit(1);
              }
            }
            console.log(`Checked ${count} inline script(s) in ${file}`);
          }
          NODE
      - name: Exercise startup patch scripts on temporary copies
        run: |
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/scripts" "$tmpdir/src/services"
          cp route.js "$tmpdir/route.js"
          cp start.js "$tmpdir/start.js"
          cp scripts/patch-route.js "$tmpdir/scripts/patch-route.js"
          cp scripts/patch-start-postback.js "$tmpdir/scripts/patch-start-postback.js"
          cp src/services/chaturbate-revshare.cjs "$tmpdir/src/services/chaturbate-revshare.cjs"
          (cd "$tmpdir" && node scripts/patch-route.js && node --check route.js && node scripts/patch-route.js)
          (cd "$tmpdir" && node scripts/patch-start-postback.js && node --check start.js && node scripts/patch-start-postback.js)
      - name: Run tests
        run: npm test
