name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and run tests
        run: |
          npm config set registry https://registry.yarnpkg.com/
          npm cache clean --force
          npm install --prefer-online --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
          npm test
      - run: npm run verify
