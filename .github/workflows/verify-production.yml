name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.cjs"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "**.cjs"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated test dependency and run tests
        run: |
          cp package.json /tmp/nightcamfinds-package.json
          cp package-lock.json /tmp/nightcamfinds-package-lock.json
          cleanup() {
            cp /tmp/nightcamfinds-package.json package.json
            cp /tmp/nightcamfinds-package-lock.json package-lock.json
          }
          trap cleanup EXIT

          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies={}; p.devDependencies={"@electric-sql/pglite":"0.5.8"}; fs.writeFileSync("package.json",JSON.stringify(p,null,2))'
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org/ \
            --fetch-retries=2 \
            --fetch-timeout=120000
          npm ci --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org/ \
            --fetch-retries=2 \
            --fetch-timeout=120000

          cleanup
          trap - EXIT
          npm test

      - name: Verify production configuration
        run: npm run verify
