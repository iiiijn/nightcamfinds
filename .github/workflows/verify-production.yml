name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.cjs"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "**.cjs"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=3 --fetch-timeout=120000

      - name: Run tests
        run: npm test

      - name: Verify production configuration
        run: npm run verify
