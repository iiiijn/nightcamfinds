name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
