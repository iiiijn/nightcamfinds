name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only dependency and run tests
        run: |
          npm install --no-save --ignore-scripts --registry=https://registry.yarnpkg.com/ @electric-sql/pglite@0.5.8
          npm test
      - run: npm run verify
