name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.cjs"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "**.cjs"
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies from lockfile and run tests
        run: |
          npm ci --omit=prod --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
          npm test

      - name: Verify production configuration
        run: npm run verify
