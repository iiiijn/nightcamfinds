name: Verify production

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  pull_request:
    paths:
      - "**.js"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated test dependencies and run tests
        run: |
          cp package.json /tmp/nightcamfinds-package.json
          cp package-lock.json /tmp/nightcamfinds-package-lock.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies={}; p.devDependencies={"@electric-sql/pglite":"0.5.8"}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          rm package-lock.json
          npm cache clean --force
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            --registry=https://registry.npmjs.org/ \
            --fetch-retries=5 \
            --fetch-retry-mintimeout=2000 \
            --fetch-retry-maxtimeout=30000
          mv /tmp/nightcamfinds-package.json package.json
          mv /tmp/nightcamfinds-package-lock.json package-lock.json
          npm test

      - name: Verify production configuration
        run: npm run verify
