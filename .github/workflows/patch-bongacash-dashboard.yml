name: Patch BongaCash dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bongacash-dashboard-patched]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/dashboard.html')
          s = p.read_text()

          old = 'id="bongaStatus">Waiting for BongaCash postback'
          new = 'id="bongaStatus">Manual affiliate-dashboard sync'
          s = s.replace(old, new)

          old = '''<tr><td><strong>BongaCash conversions</strong></td><td><span id="bongaTrackStatus" class="status-pill waiting">Waiting</span></td><td>Registrations, purchases and earnings through BongaCash postback</td><td id="bongaTrackSignal">Waiting for BongaCash postback</td></tr>'''
          new = '''<tr><td><strong>BongaCash revenue</strong></td><td><span id="bongaTrackStatus" class="status-pill active">Manual sync</span></td><td>Registrations, purchases and earnings reconciled from your BongaCash affiliate dashboard</td><td id="bongaTrackSignal">Enter the latest BongaCash figures below</td></tr>'''
          if old in s:
              s = s.replace(old, new)

          anchor = '<section class="panel"><h2>Tracking status</h2>'
          panel = '''<section class="panel" id="bongaReconcile"><h2>BongaCash earnings reconciliation</h2><p class="note">BongaCash provides affiliate reporting in its own partner area. This dashboard does not pretend to receive a postback. Enter the latest confirmed BongaCash figures here so your private dashboard can calculate earnings per click and conversion performance.</p><div class="controls"><label>Registrations <input id="bongaManualRegs" type="number" min="0" step="1" value="0"></label><label>Purchases <input id="bongaManualPurchases" type="number" min="0" step="1" value="0"></label><label>Earnings (USD) <input id="bongaManualEarnings" type="number" min="0" step="0.01" value="0"></label><button id="saveBongaManual" class="button primary" type="button">Save BongaCash figures</button><button id="clearBongaManual" class="button" type="button">Clear</button></div><p id="bongaManualStatus" class="note">No manual figures saved yet.</p></section>\n\n'''
          if 'id="bongaReconcile"' not in s:
              s = s.replace(anchor, panel + anchor, 1)

          script_anchor = "function status(t,good=false){"
          script = '''function loadBongaManual(){try{const x=JSON.parse(localStorage.getItem('ncf_bongacash_manual')||'null');if(!x)return;\$('bongaManualRegs').value=Number(x.regs||0);\$('bongaManualPurchases').value=Number(x.purchases||0);\$('bongaManualEarnings').value=Number(x.earnings||0);\$('bongaManualStatus').textContent='Saved '+new Date(x.savedAt).toLocaleString()+' · '+num(x.regs)+' registrations · '+num(x.purchases)+' purchases · '+money(x.earnings);\$('bongaRegs2').textContent=num(x.regs);\$('bongaPurchases2').textContent=num(x.purchases);\$('bongaEarnings2').textContent=money(x.earnings);const bc=Number(\$('bongaClicks').textContent.replace(/,/g,''))||0;\$('bongaEpc').textContent=money(bc?Number(x.earnings)/bc:0);\$('bongaTrackSignal').textContent='Manual figures saved '+new Date(x.savedAt).toLocaleDateString();\$('bongaTrackStatus').textContent='Manual sync';\$('bongaTrackStatus').className='status-pill active';}catch{}}\nfunction saveBongaManual(){const x={regs:Math.max(0,Number(\$('bongaManualRegs').value||0)),purchases:Math.max(0,Number(\$('bongaManualPurchases').value||0)),earnings:Math.max(0,Number(\$('bongaManualEarnings').value||0)),savedAt:new Date().toISOString()};localStorage.setItem('ncf_bongacash_manual',JSON.stringify(x));loadBongaManual();}'''
          if 'function loadBongaManual()' not in s:
              s = s.replace(script_anchor, script + '\n' + script_anchor, 1)

          old = "const bongaConnected=Boolean(j.bongacashConnected);$('bongaStatus').textContent=bongaConnected?'Postback receiver connected':'Waiting for BongaCash postback';$('bongaStatus').className=bongaConnected?'success':'';setTrack('bonga',bongaConnected,bongaConnected?'Postback receiver connected':'Waiting for BongaCash postback');$('connectionNote').textContent=bongaConnected?'BongaCash receiver is configured. Conversion events will appear here when BongaCash sends them.':'BongaCash receiver is built and awaiting the postback secret/configuration.';"
          new = "$('bongaStatus').textContent='Manual affiliate-dashboard sync';$('bongaStatus').className='success';setTrack('bonga',true,'Manual reconciliation enabled');$('connectionNote').textContent='BongaCash earnings are reconciled from the figures confirmed in your BongaCash affiliate dashboard.';loadBongaManual();"
          if old in s:
              s = s.replace(old, new)

          old = "$('loginForm').addEventListener('submit',login);$('logout').addEventListener('click',logout);$('apply').addEventListener('click',load);$('range').addEventListener('change',load);check();"
          new = "$('loginForm').addEventListener('submit',login);$('logout').addEventListener('click',logout);$('apply').addEventListener('click',load);$('range').addEventListener('change',load);$('saveBongaManual').addEventListener('click',saveBongaManual);$('clearBongaManual').addEventListener('click',()=>{localStorage.removeItem('ncf_bongacash_manual');location.reload()});check();"
          if old in s:
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard.html
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
            exit 0
          fi
          git commit -m "Add BongaCash manual earnings reconciliation [bongacash-dashboard-patched]"
          git push
