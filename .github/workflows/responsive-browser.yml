name: Responsive browser verification

on:
  pull_request:
    paths:
      - "public/**"
      - "scripts/verify-responsive-browser.js"
      - "scripts/verify-dashboard-browser.js"
      - ".github/workflows/responsive-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright browser test dependency
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify responsive layouts in Chromium
        run: node scripts/verify-responsive-browser.js
      - name: Verify private dashboard navigation and date filters
        run: node scripts/verify-dashboard-browser.js
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightcamfinds-responsive-screenshots
          path: responsive-*.png
          if-no-files-found: ignore
          retention-days: 7
