<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>NightCamFinds Analytics</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b1020;color:#f5f7ff}main{max-width:1100px;margin:0 auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#151b2e;border:1px solid #27304a;border-radius:14px;padding:20px}.muted{color:#9aa5bf;font-size:13px}.value{font-size:30px;font-weight:700;margin-top:8px}.section{margin-top:28px}table{width:100%;border-collapse:collapse}.card table td,.card table th{padding:10px;border-bottom:1px solid #27304a;text-align:left}.error{color:#ff9b9b}.ok{color:#8ee6b1}button{background:#fff;color:#111;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
</style></head>
<body><main>
<header><h1>NightCamFinds Analytics</h1><p class="muted">Private performance dashboard. Live rooms are intentionally not shown here.</p><button onclick="loadStats()">Refresh</button><span id="status" class="muted"></span></header>
<section class="grid section" id="cards"></section>
<section class="section grid"><div class="card"><h2>Platforms</h2><div id="platforms"></div></div><div class="card"><h2>Countries</h2><div id="countries"></div></div><div class="card"><h2>Traffic sources</h2><div id="sources"></div></div></section>
<section class="card section"><h2>Recent performance</h2><div id="recent"></div></section>
<script>
async function loadStats(){const s=document.getElementById('status');s.textContent=' Loading…';try{const r=await fetch('/api/dashboard-stats',{credentials:'same-origin'});if(!r.ok)throw new Error('Dashboard API returned '+r.status);const d=await r.json();
const cards=[['Affiliate clicks',d.totalClicks],['BongaCams clicks',d.bongacamsClicks],['Chaturbate clicks',d.chaturbateClicks],['Tier-1 clicks',d.tier1Clicks],['Unique visitors',d.uniqueVisitors??'—'],['CTR',d.ctr!=null?d.ctr+'%':'—']];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]??0}</div></div>`).join('');
renderMap('platforms',d.platforms);renderMap('countries',d.countries);renderMap('sources',d.sources);document.getElementById('recent').innerHTML=`<div class="muted">Today: ${d.today??0} clicks · 7 days: ${d.week??0} · 30 days: ${d.month??0}</div>`;s.textContent=' Updated';s.className='ok'}catch(e){s.textContent=' '+e.message;s.className='error'}}
function renderMap(id,obj){if(!obj||!Object.keys(obj).length){document.getElementById(id).innerHTML='<span class="muted">No data yet.</span>';return}document.getElementById(id).innerHTML='<table>'+Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')+'</table>'}
loadStats();setInterval(loadStats,30000);
</script></main></body></html>
