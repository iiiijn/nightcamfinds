<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>NightCamFinds Analytics</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#f5f7ff}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#151b2e;border:1px solid #27304a;border-radius:14px;padding:20px}.muted{color:#9aa5bf;font-size:13px}.value{font-size:30px;font-weight:700;margin-top:8px}section{margin-top:28px}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #27304a}.error{color:#ff9b9b}.ok{color:#8ee6b1}button{padding:9px 14px;border:0;border-radius:8px}</style></head><body><main><h1>NightCamFinds Analytics</h1><p class="muted">Private analytics only. Live rooms are intentionally excluded.</p><button onclick="loadStats()">Refresh</button><span id="status" class="muted"></span><section class="grid" id="cards"></section><section class="grid"><div class="card"><h2>Platforms</h2><div id="platforms"></div></div><div class="card"><h2>Countries</h2><div id="countries"></div></div><div class="card"><h2>Traffic sources</h2><div id="sources"></div></div></section><section class="card"><h2>Recent performance</h2><div id="recent"></div></section></main><script>async function loadStats(){const s=document.getElementById('status');s.textContent=' Loading…';try{const r=await fetch('/api/dashboard-stats');if(!r.ok)throw Error('API '+r.status);const d=await r.json();const c=[['Affiliate clicks',d.totalClicks],['BongaCams clicks',d.bongacamsClicks],['Chaturbate clicks',d.chaturbateClicks],['Tier-1 clicks',d.tier1Clicks],['Unique visitors',d.uniqueVisitors??'—'],['CTR',d.ctr!=null?d.ctr+'%':'—']];document.getElementById('cards').innerHTML=c.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]??0}</div></div>`).join('');map('platforms',d.platforms);map('countries',d.countries);map('sources',d.sources);document.getElementById('recent').textContent=`Today: ${d.today??0} clicks · 7 days: ${d.week??0} · 30 days: ${d.month??0} clicks`;s.textContent=' Updated';s.className='ok'}catch(e){s.textContent=' '+e.message;s.className='error'}}function map(id,o){document.getElementById(id).innerHTML=o&&Object.keys(o).length?'<table>'+Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')+'</table>':'<span class="muted">No data yet.</span>'}loadStats();setInterval(loadStats,30000)</script></body></html>
